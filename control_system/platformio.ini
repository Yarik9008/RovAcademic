; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

; Сборка вне папки проекта (только ASCII-путь): на Windows GNU ld часто падает с
; "cannot open map file ... firmware.map", если PROJECT_DIR с кириллицей или очень длинный
; (Яндекс.Диск и т.п.). Артефакты окажутся в %TEMP%\pio_rov_control_system
; На Linux/Mac при необходимости закомментируйте блок [platformio] ниже.
[platformio]
build_dir = ${sysenv.TEMP}/pio_rov_control_system

[env:bluepill_f103c8]
platform = ststm32
board = bluepill_f103c8
framework = arduino

; Change microcontroller
board_build.mcu = stm32f103c8t6

; Change MCU frequency
board_build.f_cpu = 72000000L

; Загрузка прошивки через ST-Link (OpenOCD)
upload_protocol = stlink
debug_tool = stlink

; DFU / stm32duino bootloader не используется при прошивке через ST-Link
; (если понадобится снова USB-загрузка: upload_protocol = dfu и board_build.bootloader = stm32duino)

; USB Serial settings
board_build.usb_product = "STM32F103 ROV Control"
board_build.usb_manufacturer = "Custom"
board_build.usb_vid = 0x1EAF
board_build.usb_pid = 0x0003

; Enable USB CDC Serial (from STM32 guide)
build_flags = 
    -D PIO_FRAMEWORK_ARDUINO_ENABLE_CDC
    -D USBCON
    -D USBD_VID=0x0483
    -D USBD_PID=0x5740
    -D USB_MANUFACTURER="Custom"
    -D USB_PRODUCT="\"STM32F103 ROV Control\""
    -D HAL_PCD_MODULE_ENABLED

; Serial Monitor settings
monitor_speed = 57600
monitor_port = auto
monitor_dtr = 0
monitor_rts = 0

; Libraries
lib_deps = 
    Servo
    gyverlibs/GParser
    gyverlibs/AsyncStream
    gyverlibs/ServoSmooth
    gyverlibs/GyverFilters
