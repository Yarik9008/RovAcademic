; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

; build_dir вне каталога с кириллицей; на Linux задайте TEMP. Прошивка: $SOURCE = firmware.bin.
[platformio]
build_dir = ${sysenv.TEMP}/pio_build/gripper

[env:stm32f103c8]
platform = ststm32
board = genericSTM32F103C8
framework = arduino

build_flags =
    -DSTM32F103xB
    -DUSE_HAL_DRIVER
    -DENABLE_HWSERIAL1
    -Wl,-u,_printf_float
    -I include

upload_protocol = custom
upload_command = openocd -f openocd/wch-link.cfg -f target/stm32f1x.cfg -c "program $SOURCE 0x08000000 verify reset" -c "shutdown"

; Библиотеки
lib_deps =
    adafruit/Adafruit INA219@^1.2.0
