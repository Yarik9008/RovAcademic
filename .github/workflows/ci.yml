# Сборка основных прошивок (без unit_test — отдельные платы/зависимости).
name: Build

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  pio:
    runs-on: ubuntu-latest
    env:
      TEMP: /tmp
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install PlatformIO
        run: pip install platformio

      - name: Build control_system
        run: pio run -d control_system

      - name: Build gamepad
        run: pio run -d gamepad

      - name: Build gripper
        run: pio run -d gripper
